services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/huxnStore
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  mongo_data:
  uploads_data: